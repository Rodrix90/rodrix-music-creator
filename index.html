<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodrix Music Creator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235A67D8'/%3E%3Cpath d='M6 32 C12 32 12 18 18 18 S24 46 30 46 S36 14 42 14 S48 40 52 40 S56 32 58 32' fill='none' stroke='%23fff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root{
  --bg:#0F0F17; --side:#1F1F2E; --card:#2C2C3A; --border:#3A3A4D;
  --accent:#5A67D8; --accent-dark:#3540A3; --ok:#34D399; --danger:#F87171;
  --text:#E0E0E6; --muted:#9A9AB0; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr 360px;height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 6px}
.logo-icon{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:22px;color:#fff;flex-shrink:0;box-shadow:0 4px 14px rgba(90,103,216,.45)}
.logo-text{font-weight:700;font-size:15px;line-height:1.2}
.nav{list-style:none;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;color:var(--text);text-decoration:none;border-left:4px solid transparent;border-radius:0 8px 8px 0;transition:.2s;font-weight:500}
.nav a i{font-size:20px}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.active{background:var(--accent-dark);border-left-color:var(--accent);color:#fff}
.side-foot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.side-foot a{color:var(--muted);text-decoration:none;display:flex;gap:8px;align-items:center}
.side-foot a:hover{color:var(--text)}
.user-mail{word-break:break-all}

/* ---------- CENTER ---------- */
.center{overflow-y:auto;padding:28px 32px 60px}
.center-inner{max-width:900px;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);padding:5px 12px;border-radius:99px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.badge.off{color:var(--danger);background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35)}
.badge.off .dot{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
textarea,input[type=text],select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font:inherit;transition:.2s;resize:vertical}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,103,216,.25)}
::placeholder{color:#6B6B80}
#styleInput{min-height:110px;border-color:var(--accent);background:linear-gradient(180deg,rgba(90,103,216,.08),var(--bg))}
#lyricsInput{min-height:200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:#3A3A4D;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#7C8BFF;border:2px solid #fff;box-shadow:0 0 12px 3px rgba(124,139,255,.7);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#7C8BFF;border:2px solid #fff;box-shadow:0 0 12px 3px rgba(124,139,255,.7);cursor:pointer}
.val{color:var(--text);font-weight:600;letter-spacing:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:12px;font-weight:600;transition:.2s}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* advanced */
details.adv{border:1px solid var(--border);border-radius:var(--radius);padding:0}
details.adv summary{padding:13px 16px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary{border-bottom:1px solid var(--border)}
.adv-body{padding:16px;display:flex;flex-direction:column;gap:18px}
.file-row{display:flex;gap:8px;align-items:center}
.file-row input[type=file]{flex:1;color:var(--muted);font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);display:grid;place-items:center;font-size:17px;transition:.2s;flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}

/* actions */
.actions{display:flex;gap:10px}
.btn-main{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 24px rgba(90,103,216,.5);display:flex;gap:10px;align-items:center;justify-content:center;transition:.2s}
.btn-main:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-main:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-sec{background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:var(--radius);padding:0 16px;font-size:18px}
.btn-sec:hover{color:var(--text)}
.btn-stop{background:rgba(248,113,113,.12);color:var(--danger);border-color:rgba(248,113,113,.4)}
.progress-wrap{display:none;flex-direction:column;gap:8px}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.progress{height:6px;background:#E0E0E6;border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .6s ease}
.console{background:#000;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-family:'Consolas','Courier New',monospace;font-size:12px;color:#8DF0C0;height:140px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.console .err{color:var(--danger)}
.console .dim{color:#6B7280}

/* ---------- LIBRARY ---------- */
.library{background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.lib-head{padding:20px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.lib-head h2{font-size:16px;font-weight:700}
.lib-list{flex:1;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:13px}
.track{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;gap:12px;transition:.2s}
.track:hover{border-color:var(--accent)}
.track.playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(90,103,216,.25)}
.thumb{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#3540A3,#7C3AED);flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.thumb .bar{width:4px;border-radius:2px;background:linear-gradient(180deg,#fff,#A5B4FC);height:30%;position:relative;z-index:1}
.track.playing .bar{animation:wave 1s ease-in-out infinite}
.bar:nth-child(2){animation-delay:.1s!important;height:60%}.bar:nth-child(3){animation-delay:.25s!important;height:85%}
.bar:nth-child(4){animation-delay:.15s!important;height:50%}.bar:nth-child(5){animation-delay:.3s!important;height:70%}
.bar:nth-child(6){animation-delay:.05s!important;height:40%}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}
.t-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.t-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.tag{background:rgba(90,103,216,.18);color:#A5B4FC;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:600}
.t-actions{display:flex;gap:6px;align-items:center;margin-top:auto;position:relative}
.btn-play{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;display:flex;gap:5px;align-items:center}
.btn-play:hover{filter:brightness(1.15)}
.t-actions .icon-btn{width:30px;height:30px;font-size:15px}
.menu{display:none;position:absolute;bottom:36px;right:0;background:var(--side);border:1px solid var(--border);border-radius:8px;overflow:hidden;z-index:5;min-width:100px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu.open{display:block}
.menu a{display:block;padding:8px 14px;color:var(--text);text-decoration:none;font-size:12px}
.menu a:hover{background:var(--accent-dark)}
.player{border-top:1px solid var(--border);padding:12px 16px;display:none;flex-direction:column;gap:6px;background:#181826}
.player.show{display:flex}
.player .pt{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player audio{width:100%;height:34px}

.mobile-tabs{display:none}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1100px){
  .app{grid-template-columns:72px 1fr 320px}
  .logo-text,.nav a span,.side-foot span{display:none}
  .nav a{justify-content:center;padding:12px 0;border-left-width:4px}
  .logo{justify-content:center}
}
@media(max-width:760px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  .sidebar{flex-direction:row;align-items:center;padding:10px 14px;border-right:none;border-bottom:1px solid var(--border)}
  .logo{margin:0}
  .nav{flex-direction:row;margin-left:auto}
  .side-foot{display:none}
  .center{padding:18px 14px 30px;overflow:visible}
  .grid2{grid-template-columns:1fr}
  .library{border-left:none;border-top:1px solid var(--border);min-height:400px}
  .mobile-tabs{display:flex}
}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon"><i class="ph ph-music-notes"></i></div>
      <div class="logo-text">Rodrix Music Creator</div>
    </div>
    <ul class="nav">
      <li><a href="#" class="active" id="nav-crear"><i class="ph ph-plus-circle"></i><span>Crear canción</span></a></li>
      <li><a href="#" id="nav-libreria"><i class="ph ph-books"></i><span>Librería</span></a></li>
      <li><a href="#" id="nav-ajustes"><i class="ph ph-sliders-horizontal"></i><span>Ajustes</span></a></li>
      <li><a href="#" id="nav-ayuda"><i class="ph ph-question"></i><span>Ayuda</span></a></li>
    </ul>
    <div class="side-foot">
      <span class="user-mail">{{USER_EMAIL}}</span>
      <a href="/api/logout"><i class="ph ph-sign-out"></i><span>Cerrar sesión</span></a>
    </div>
  </aside>

  <!-- CENTER -->
  <main class="center">
    <div class="center-inner">
      <div class="page-head">
        <h1>Panel de Creación</h1>
        <span class="badge" id="serverBadge"><span class="dot"></span><span id="serverText">Servidor Online</span></span>
      </div>

      <form class="form-card" id="genForm" autocomplete="off">
        <div class="field">
          <label class="label" for="styleInput">Prompt de estilo y voz</label>
          <textarea id="styleInput" required placeholder="Describe todo aquí: Voz como Luis Miguel, estilo pop energético mexicano, con guitarras eléctricas Stratocaster y mucho flanger..."></textarea>
        </div>

        <div class="field">
          <label class="label" for="lyricsInput">
            <span>Letra</span>
            <span class="check"><input type="checkbox" id="instrumental"> Instrumental</span>
          </label>
          <textarea id="lyricsInput" placeholder="[Verse]&#10;Escribe aquí tu letra..."></textarea>
        </div>

        <div class="field">
          <label class="label" for="pronInput"><span>Pronunciación (opcional)</span></label>
          <textarea id="pronInput" style="min-height:70px" placeholder="Una por línea: palabra=como suena&#10;Ej: humillado=humiyado"></textarea>
        </div>

        <div class="grid2">
          <div class="field">
            <label class="label" for="titleInput">Título</label>
            <input type="text" id="titleInput" required placeholder="Ej: Himno Épico">
          </div>
          <div class="field">
            <label class="label" for="modelInput">IA Model</label>
            <select id="modelInput">
              <option value="chirp-v4-5">chirp-v4-5 (10 cr)</option>
              <option value="chirp-v4-5-plus">chirp-v4-5-plus (10 cr)</option>
              <option value="chirp-v5" selected>chirp-v5 (12 cr)</option>
              <option value="chirp-v5-5">chirp-v5-5 (12 cr)</option>
              <option value="chirp-v4">chirp-v4 (8 cr)</option>
              <option value="chirp-v3-5">chirp-v3-5 (5 cr)</option>
            </select>
          </div>
        </div>

        <div class="field">
          <div class="label"><span>Control vocal</span></div>
          <div class="seg" id="genderSeg">
            <button type="button" data-g="random" class="on">Aleatoria</button>
            <button type="button" data-g="male">Masculina</button>
            <button type="button" data-g="female">Femenina</button>
          </div>
        </div>

        <div class="field">
          <label class="label"><span>Weirdness</span><span class="val" id="wVal">25%</span></label>
          <input type="range" id="weirdness" min="0" max="100" value="25">
        </div>

        <details class="adv" id="advanced">
          <summary><i class="ph ph-gear"></i> Opciones avanzadas</summary>
          <div class="adv-body">
            <div class="field">
              <label class="label"><span>Style Influence</span><span class="val" id="siVal">50%</span></label>
              <input type="range" id="styleInfluence" min="0" max="100" value="50">
            </div>
            <div class="field">
              <label class="label"><span>Audio Influence</span><span class="val" id="aiVal">25%</span></label>
              <input type="range" id="audioInfluence" min="0" max="100" value="25">
            </div>
            <div class="field">
              <label class="label">Audio de referencia (Extend / Remix)</label>
              <div class="file-row">
                <input type="file" id="audioInput" accept="audio/*">
                <button type="button" class="icon-btn" id="clearAudio" title="Quitar audio"><i class="ph ph-x"></i></button>
              </div>
            </div>
            <div class="field">
              <label class="label" for="excludeInput">Excluir estilos</label>
              <input type="text" id="excludeInput" placeholder="Ej: autotune, trap">
            </div>
            <label class="check"><input type="checkbox" id="bypass" checked> Anti-Copyright</label>
          </div>
        </details>

        <details class="adv" id="mastering">
          <summary><i class="ph ph-faders"></i> Masterización profesional (se aplica al descargar)</summary>
          <div class="adv-body">
            <div class="seg" style="flex-wrap:wrap">
              <button type="button" data-preset="stereo">Stereo Wide</button>
              <button type="button" data-preset="radio">Radio / Loud</button>
              <button type="button" data-preset="warm">Cálido</button>
              <button type="button" data-preset="streaming">Streaming</button>
              <button type="button" data-preset="reset">Sin master</button>
            </div>
            <div class="field">
              <label class="label"><span>Ancho estéreo / paneo</span><span class="val" id="mWidthVal">Original</span></label>
              <input type="range" id="mWidth" min="1" max="2.5" step="0.1" value="1">
            </div>
            <div class="grid2">
              <div class="field">
                <label class="label" for="mEq">Ecualización</label>
                <select id="mEq">
                  <option value="none">Neutra</option>
                  <option value="warm">Cálida (graves +)</option>
                  <option value="bright">Brillante (agudos +)</option>
                  <option value="vocal">Voz presente</option>
                  <option value="bass">Graves potentes</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="mLoud">Volumen / Loudness</label>
                <select id="mLoud">
                  <option value="none">Original</option>
                  <option value="streaming">Streaming (-14 LUFS)</option>
                  <option value="loud">Fuerte (-9 LUFS)</option>
                </select>
              </div>
            </div>
          </div>
        </details>

        <div class="actions">
          <button type="submit" class="btn-main" id="submitBtn"><i class="ph ph-sparkle"></i> Generar canción</button>
          <button type="button" class="btn-sec btn-stop" id="cancelBtn" title="Cancelar" style="display:none"><i class="ph ph-stop"></i></button>
          <button type="button" class="btn-sec" id="clearBtn" title="Limpiar formulario"><i class="ph ph-trash"></i></button>
        </div>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-top"><span id="progressText">Iniciando...</span><span id="progressPct">0%</span></div>
          <div class="progress"><div id="progressFill"></div></div>
        </div>

        <div class="field">
          <div class="label"><span>Consola</span></div>
          <div class="console" id="console"><span class="dim">Esperando generación...</span></div>
        </div>
      </form>
    </div>
  </main>

  <!-- LIBRARY -->
  <aside class="library" id="library">
    <div class="lib-head">
      <h2>Mi Librería</h2>
      <button class="icon-btn" id="refreshLib" title="Actualizar"><i class="ph ph-arrows-clockwise"></i></button>
    </div>
    <div class="lib-list" id="libList"><div class="empty">Cargando...</div></div>
    <div class="player" id="player">
      <div class="pt" id="playerTitle">-</div>
      <audio id="audio" controls></audio>
    </div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
let currentTask = null, pollTimer = null, progressTimer = null, progress = 0;
let currentTrackId = null;

/* ---------- UI helpers ---------- */
function bindRange(id, outId){ $(id).addEventListener('input', e => $(outId).textContent = e.target.value + '%'); }
bindRange('weirdness','wVal'); bindRange('styleInfluence','siVal'); bindRange('audioInfluence','aiVal');

let gender = 'random';
document.querySelectorAll('#genderSeg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#genderSeg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); gender = b.dataset.g;
}));

$('instrumental').addEventListener('change', e => {
  $('lyricsInput').disabled = e.target.checked;
  $('lyricsInput').style.opacity = e.target.checked ? .4 : 1;
});
$('clearAudio').addEventListener('click', () => $('audioInput').value = '');
$('clearBtn').addEventListener('click', () => {
  ['styleInput','lyricsInput','titleInput','excludeInput','pronInput'].forEach(i => $(i).value = '');
  $('audioInput').value = '';
});

/* navegación */
function setActive(id){ document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active')); $(id).classList.add('active'); }
$('nav-crear').onclick = e => { e.preventDefault(); setActive('nav-crear'); document.querySelector('.center').scrollTo({top:0,behavior:'smooth'}); };
$('nav-libreria').onclick = e => { e.preventDefault(); setActive('nav-libreria'); loadLibrary(); $('library').scrollIntoView({behavior:'smooth'}); };
$('nav-ajustes').onclick = e => { e.preventDefault(); setActive('nav-ajustes'); $('advanced').open = true; $('advanced').scrollIntoView({behavior:'smooth',block:'center'}); };
$('nav-ayuda').onclick = e => { e.preventDefault(); setActive('nav-ayuda');
  alert('Cómo usar Rodrix Music Creator:\n\n1. Escribe en "Prompt de estilo y voz" la voz, el estilo, los instrumentos y efectos.\n2. Pega la letra (o marca Instrumental).\n3. Pon un título y pulsa "Generar canción".\n4. Tu canción aparecerá en la Librería a la derecha: Escuchar, Descargar (MP3/WAV/FLAC) o Eliminar.'); };

/* consola */
function logLine(text, cls){
  const c = $('console');
  if (c.querySelector('.dim')) c.innerHTML = '';
  const s = document.createElement('div'); if (cls) s.className = cls; s.textContent = text; c.appendChild(s);
  c.scrollTop = c.scrollHeight;
}
function renderLogs(text){
  const c = $('console'); c.innerHTML = '';
  (text || '').split('\n').filter(Boolean).forEach(l => {
    const s = document.createElement('div');
    if (/ERROR|FALLO/i.test(l)) s.className = 'err';
    s.textContent = l; c.appendChild(s);
  });
  c.scrollTop = c.scrollHeight;
}

/* progreso */
function setProgress(p, txt){
  progress = Math.min(100, p);
  $('progressFill').style.width = progress + '%';
  $('progressPct').textContent = Math.round(progress) + '%';
  if (txt) $('progressText').textContent = txt;
}
function startProgress(){
  $('progressWrap').style.display = 'flex'; setProgress(3, 'Enviando solicitud...');
  clearInterval(progressTimer);
  progressTimer = setInterval(() => { if (progress < 92) setProgress(progress + (92 - progress) * 0.025, 'Generando música...'); }, 1000);
}
function stopProgress(ok, txt){
  clearInterval(progressTimer);
  setProgress(ok ? 100 : progress, txt);
  setTimeout(() => { $('progressWrap').style.display = 'none'; }, 3500);
}
function setBusy(b){
  $('submitBtn').disabled = b;
  $('cancelBtn').style.display = b ? 'block' : 'none';
}

/* ---------- Generar ---------- */
$('genForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData();
  const instr = $('instrumental').checked;
  fd.append('style', $('styleInput').value.trim());
  fd.append('lyrics', instr ? '[Instrumental]' : $('lyricsInput').value);
  fd.append('title', $('titleInput').value.trim());
  fd.append('include_lyrics', !instr);
  fd.append('bypass_copyright', $('bypass').checked);
  fd.append('exclude_styles', $('excludeInput').value);
  fd.append('vocal_gender', gender);
  fd.append('weirdness', $('weirdness').value);
  fd.append('style_influence', $('styleInfluence').value);
  fd.append('audio_influence', $('audioInfluence').value);
  fd.append('model', $('modelInput').value);
  fd.append('pronunciation', $('pronInput').value);
  if ($('audioInput').files[0]) fd.append('audio', $('audioInput').files[0]);

  $('console').innerHTML = '';
  setBusy(true); startProgress();
  logLine('Enviando solicitud al servidor...');
  try {
    const r = await fetch('/api/transform', { method:'POST', body: fd });
    if (r.status === 401 || r.status === 403) { location.href = '/login'; return; }
    if (!r.ok) { const j = await r.json().catch(()=>({})); throw new Error(j.detail || ('HTTP ' + r.status)); }
    const j = await r.json();
    currentTask = j.task_id;
    pollTimer = setInterval(poll, 3000); poll();
  } catch (err) {
    logLine('ERROR: ' + err.message, 'err');
    stopProgress(false, 'Error'); setBusy(false);
  }
});

async function poll(){
  if (!currentTask) return;
  try {
    const r = await fetch('/api/status/' + currentTask);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.json();
    renderLogs(t.logs);
    if (t.status === 'COMPLETED') {
      finish(); stopProgress(true, '¡Canción lista!'); await loadLibrary();
    } else if (t.status === 'ERROR') {
      finish(); logLine('ERROR: ' + (t.detail || 'falló la generación'), 'err'); stopProgress(false, 'Error');
    } else if (t.status === 'CANCELLED') {
      finish(); stopProgress(false, 'Cancelado');
    }
  } catch (err) { /* reintenta en el siguiente ciclo */ }
}
function finish(){ clearInterval(pollTimer); currentTask = null; setBusy(false); }

$('cancelBtn').addEventListener('click', async () => {
  if (!currentTask) return;
  await fetch('/api/task/' + currentTask, { method:'DELETE' }).catch(()=>{});
  logLine('Cancelando...');
});

/* ---------- Librería ---------- */
function fmtDur(s){ s = Math.round(+s || 0); return s ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : '--:--'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadLibrary(){
  try {
    const r = await fetch('/api/library');
    if (r.status === 401 || r.status === 403) { location.href = '/login'; return; }
    const j = await r.json();
    setServer(true);
    renderLibrary(j.tracks || []);
  } catch (e) { setServer(false); $('libList').innerHTML = '<div class="empty">No se pudo cargar la librería.</div>'; }
}
function setServer(ok){
  $('serverBadge').classList.toggle('off', !ok);
  $('serverText').textContent = ok ? 'Servidor Online' : 'Servidor Offline';
}
function renderLibrary(tracks){
  const l = $('libList');
  if (!tracks.length) { l.innerHTML = '<div class="empty">Aún no hay pistas. ¡Crea tu primera canción!</div>'; return; }
  l.innerHTML = tracks.map(t => `
    <div class="track ${t.id === currentTrackId ? 'playing' : ''}" data-id="${esc(t.id)}">
      <div class="thumb">${t.image_url ? `<img src="${esc(t.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
      <div class="t-info">
        <div class="t-title" title="${esc(t.title)}">${esc(t.title)}</div>
        <div class="t-meta"><span>${fmtDur(t.duration)}</span><span class="tag">Premium</span>${/instrumental/i.test(t.title) ? '<span class="tag">Instrumental</span>' : ''}</div>
        <div class="t-actions">
          <button class="btn-play" data-act="play"><i class="ph ph-play"></i> Escuchar</button>
          <button class="icon-btn" data-act="dl" title="Descargar"><i class="ph ph-download-simple"></i></button>
          <button class="icon-btn del" data-act="del" title="Eliminar"><i class="ph ph-trash"></i></button>
          <div class="menu">
            <a href="#" data-dl="mp3" data-id="${esc(t.id)}">MP3</a>
            <a href="#" data-dl="wav" data-id="${esc(t.id)}">WAV</a>
            <a href="#" data-dl="flac" data-id="${esc(t.id)}">FLAC</a>
          </div>
        </div>
      </div>
    </div>`).join('');
  l._tracks = tracks;
}

$('libList').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) { return; }
  const card = btn.closest('.track'); const id = card.dataset.id;
  const act = btn.dataset.act;
  if (act === 'play') {
    const t = ($('libList')._tracks || []).find(x => x.id === id); if (!t) return;
    currentTrackId = id;
    $('audio').src = t.audio_url; $('audio').play().catch(()=>{});
    $('playerTitle').textContent = t.title; $('player').classList.add('show');
    document.querySelectorAll('.track').forEach(c => c.classList.toggle('playing', c.dataset.id === id));
  } else if (act === 'dl') {
    const m = card.querySelector('.menu');
    document.querySelectorAll('.menu.open').forEach(x => { if (x !== m) x.classList.remove('open'); });
    m.classList.toggle('open'); e.stopPropagation();
  } else if (act === 'del') {
    if (!confirm('¿Eliminar esta pista de la librería?')) return;
    const r = await fetch('/api/library/' + encodeURIComponent(id), { method:'DELETE' });
    if (r.ok) { if (id === currentTrackId) { $('audio').pause(); $('player').classList.remove('show'); currentTrackId = null; } loadLibrary(); }
  }
});
document.addEventListener('click', () => document.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open')));
$('audio').addEventListener('ended', () => document.querySelectorAll('.track.playing').forEach(c => c.classList.remove('playing')));
$('audio').addEventListener('pause', () => document.querySelectorAll('.track.playing').forEach(c => c.classList.remove('playing')));
$('audio').addEventListener('play', () => document.querySelectorAll('.track').forEach(c => c.classList.toggle('playing', c.dataset.id === currentTrackId)));
$('refreshLib').addEventListener('click', loadLibrary);

/* ---------- Masterización (se aplica al descargar) ---------- */
const masterIds = ['mWidth','mEq','mLoud'];
function saveMaster(){ localStorage.setItem('rodrixMaster', JSON.stringify({w:$('mWidth').value, eq:$('mEq').value, loud:$('mLoud').value})); }
function updateWidthLabel(){ const v = +$('mWidth').value; $('mWidthVal').textContent = v <= 1 ? 'Original' : 'x' + v.toFixed(1); }
try { const s = JSON.parse(localStorage.getItem('rodrixMaster') || '{}');
  if (s.w) $('mWidth').value = s.w; if (s.eq) $('mEq').value = s.eq; if (s.loud) $('mLoud').value = s.loud; } catch(e){}
updateWidthLabel();
masterIds.forEach(i => $(i).addEventListener('input', () => { updateWidthLabel(); saveMaster(); }));
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
  const p = {
    stereo:  {w:1.6, eq:'none',   loud:'none'},
    radio:   {w:1.3, eq:'bright', loud:'loud'},
    warm:    {w:1.2, eq:'warm',   loud:'streaming'},
    streaming:{w:1.3, eq:'none',  loud:'streaming'},
    reset:   {w:1.0, eq:'none',   loud:'none'}
  }[b.dataset.preset];
  $('mWidth').value = p.w; $('mEq').value = p.eq; $('mLoud').value = p.loud;
  updateWidthLabel(); saveMaster();
}));
$('libList').addEventListener('click', e => {
  const a = e.target.closest('a[data-dl]'); if (!a) return;
  e.preventDefault();
  const q = new URLSearchParams({ width: $('mWidth').value, eq: $('mEq').value, loud: $('mLoud').value });
  window.open('/api/download/' + encodeURIComponent(a.dataset.id) + '/' + a.dataset.dl + '?' + q.toString(), '_blank');
});

loadLibrary();
</script>
